spring:
  application:
    name: restosuite
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/restosuite}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  web:
    locale: es
    locale-resolver: fixed

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-use-32-characters}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:4200}
  admin:
    email: ${ADMIN_EMAIL:admin@restosuite.local}
    password: ${ADMIN_PASSWORD:Admin123!}
    name: ${ADMIN_NAME:Administrador}
  storage:
    path: ${APP_STORAGE_PATH:./uploads}

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    org.springframework.security: INFO

---
spring:
  config:
    activate:
      on-profile: prod
